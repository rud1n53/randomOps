
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="mainData.js"></script>
    <script src="memData.js"></script>
    <title>Document</title>
    <style>
        .wrapper{
            margin: 5em;
            padding: 1.5rem;
            position: fixed;
            top: 50%;
            right: 0;
            transform: translate(0,-60%);
            text-align: right;
            color: white;
            background-color: rgba(0,0,0,0.5);
        }
        #title{
            font-size: 10vh;
            margin: 0;
        }
        p{
            font-size: 2rem;
            font-weight: 500;
            margin: 0.5em;
        }
        body {
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: black;
        }
        #background {
            position: fixed;
            inset: 0;
            transform: scale(1.08);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 5s ease, transform 5s ease;
            z-index: 0;
        }
        #background.show {
            transform: scale(1);
            opacity: 1;
        }
        .typing::after {
            content: "|";
            display: inline-block;
            margin-left: 3px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="background"></div>

    <div class="wrapper">
        <h1 id="title"></h1>
        <p id="diff"></p>
        <p id="bundae"></p>
        <p id="descript" style="font-size: 1rem;"></p>
        <p id="continue" style="font-size: 1rem;"></p>
    </div>
</body>
<script>
    const themeList = ["팬텀 & 크림슨 솔리테어", "미즈키 & 카이룰라 아버", "탐험가의 은빛 서리 끝자락", "살카즈의 영겁 기담", "쉐이의 기이한 계원", "침몰자의 블랙 플로우"];
    const theme = sessionStorage.getItem("theme");
    const bundae = sessionStorage.getItem("bundae");
    const diff = sessionStorage.getItem("diff");
    const stCart = JSON.parse(sessionStorage.getItem("stCart"));
    const title = document.getElementById("title");
    const pBundae = document.getElementById("bundae");
    const pdiff = document.getElementById("diff");
    const pDescript = document.getElementById("descript")
    const pContinue = document.getElementById("continue");
    const background = document.getElementById("background");

    function wait(ms) {
        return new Promise(res => setTimeout(res, ms));
    }

    const typing = async (element, msg, delay) => {
        element.classList.add("typing");
        const letter = Array.from(msg);
        while (letter.length) {
            await wait(70);
            element.textContent += letter.shift();
        }
        await wait(delay);
        element.classList.remove("typing");
    };

    const main = async () => {

        background.style.backgroundImage = `url("enterImages/${theme}.webp")`;

        const img = new Image();
        img.src = `enterImages/${theme}.webp`;
        await new Promise(resolve => {
            if (img.complete) resolve();
            else img.onload = resolve;
        });
        await new Promise(requestAnimationFrame);

        background.classList.add("show");

        typing(title, themeList[theme], 2000);
        
        await wait(3000);
        await typing(pdiff, `${diff}승천`, 1000);
        await typing(pBundae, bundae, 1000);
        await typing(pDescript, `${stCart[0]} : ${memKor[stCart[1]]} / ${memKor[stCart[2]]} / ${memKor[stCart[3]]}`, 1000);
        //if (bundae == "특근 분대")
        pContinue.innerText = "아무 곳이나 눌러 대원을 모집하세요. 마음에 들 때까지 언제고.";
        pContinue.classList.add("typing");

        document.body.style.cursor = "pointer";
        document.addEventListener('click', (event) => {
            window.open("gacha.html", "popup", "width=1000,height=600,resizable=no,scrollbars=no");
        });
    };
    main();
</script>
</html>
