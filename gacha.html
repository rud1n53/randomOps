<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="mainData.js"></script>
    <script src="memData.js"></script>
    <title>대원들이 당신을 돕고자 합니다..</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #242424;
        }

        .table {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 1200px;
        }
        .card {
            width: 220px;
            height: 313px;
            position: absolute;
            left: 50%;
            top: 50%;
            background-position: center;
            background-size: contain;
            background-repeat: no-repeat;
            transform: translate(-50%, -50%);
            transform-origin: 50% 85%;
            transition:
                transform 0.65s cubic-bezier(0.2, 0.8, 0.3, 1),
                filter 0.4s;
        }
        #card1, #card2, #card3 {
            opacity: 0;
        }
        #card1 {
            z-index: 3;
        }
        #card2 {
            z-index: 2;
        }
        #card3 {
            z-index: 1;
        }
        #cover {
            background-image: url('img/05_rhodes_island_background.png');
            z-index: 100;
            cursor: pointer;
            animation: slideIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }

        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translate(calc(-50% - 500px), -50%) rotate(-5deg);
            }
            70% {
                opacity: 1;
                transform: translate(calc(-50% + 12px), -50%) rotate(1deg);
            }
            85% {
                transform: translate(calc(-50% - 5px), -50%) rotate(-0.4deg);
            }
            100% {
                transform: translate(-50%, -50%) rotate(0deg);
            }
        }

        #table.spread #card1 {
            transform: translate(-90%, -50%) rotate(-10deg);
            transition-delay: transform 0s;
        }
        #table.spread #card2 {
            transform: translate(-50%, -50%) rotate(11deg);
            transition-delay: transform 0.03s;
        }
        #table.spread #card3 {
            transform: translate(-10%, -50%) rotate(28deg);
            transition-delay: transform 0.07s;
        }
        #table.spread .card:not(#cover) {
            filter: drop-shadow(0 8px 8px rgba(0,0,0,0.35));
        }
        #table.open .card{
            opacity: 1;
        }
        #table.open #cover {
            pointer-events: none;
            transform: translate(-100%, -50%) rotate(-30deg);
        }

        #result {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            gap: 12px;
            padding: 4vh 5vw;
            background: rgba(0, 0, 0, 0.55);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #result.show {
            opacity: 1;
            visibility: visible;
        }
        .res-row { /*오퍼 한 줄*/
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 30px;
            width: min(65vw, 800px);
            height: 27vh;

            opacity: 0;
        }
        .res-name {
            flex: 1;
            text-align: right;
            color: white;
            font-size: clamp(20px, 3vw, 36px);
            font-weight: bold;
            text-shadow: 0 2px 8px black;
        }
        .res-img {
            width: min(15vw, 180px);
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.55);
            border: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background-position: center;
            background-size: cover;
        }
        #result.show .res-row {
            animation: resultAppear 0.4s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
        }
        #result.show .res-row:nth-child(1) {
            animation-delay: 0s;
        }
        #result.show .res-row:nth-child(2) {
            animation-delay: 0.2s;
        }
        #result.show .res-row:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes resultAppear {
            from {
                opacity: 0;
                transform: translateX(60px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="table" id="table">
        <div class="card" id="cover"></div>
        <div class="card" id="card1"></div>
        <div class="card" id="card2"></div>
        <div class="card" id="card3"></div>
    </div>
    <div id="result">
        <div class="res-row">
            <div class="res-name" id="res1"></div>
            <div class="res-img" id="img1"></div>
        </div>
        <div class="res-row">
            <div class="res-name" id="res2"></div>
            <div class="res-img" id="img2"></div>
        </div>
        <div class="res-row">
            <div class="res-name" id="res3"></div>
            <div class="res-img" id="img3"></div>
        </div>
    </div>
</body>
<script> //서류 펼치는 애니메이션
    const table = document.getElementById("table");
    const cover = document.getElementById("cover");
    const imgs = document.getElementsByClassName("res-img");
    const names = document.getElementsByClassName("res-name");
    let isOpened = false;
    let isArrived = false;

    cover.addEventListener("animationend", function() {
        isArrived = true;
        cover.style.cursor = "pointer";
    });
    cover.addEventListener("click", function() {
        if (isOpened) return;
        if (!isArrived) {
            cover.style.animation = "none";
            cover.style.transform = "translate(-100%, -50%) rotate(-30deg)";
            cover.style.opacity = "1";
            isArrived = true;
        }

        isOpened = true;
        table.classList.add("open");
        table.classList.add("spread");
        setTimeout(() => {
            for(let i = 0; i < 3; i++){
                names[i].textContent = candsList[i];
                imgs[i].style.backgroundImage = `url("./img/charimgs/${rarity[i]+1}star/${candsList[i].replace(/ /g,"")}.webp")`;
            }
            document.getElementById("result").classList.add("show");
        }, 1500);
    });
</script>
<script> //멤버 정하는 알고리즘
    const stCart = JSON.parse(sessionStorage.getItem("stCart"));
    const theme = sessionStorage.getItem("theme");
    const bundae = sessionStorage.getItem("bundae");
    const diff = sessionStorage.getItem("diff");
    const cards = document.getElementsByClassName("card");

    const randomInt = (max) => {
        const limit = Math.floor(4294967296 / max) * max;
        const arr = new Uint32Array(1);
        let val;
        do {
            crypto.getRandomValues(arr);
            val = arr[0];
        } while (val >= limit);
        return val % max;
    };
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            let j = randomInt(i + 1);
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    var rarity = [5, 4, 3] //0-based라 1 더해서 생각해야함
    var hopeNeedNow = hopeNeed[theme];
    var maxHope = 6;

    if(theme == 0 || theme == 2 || theme == 3){ //팬텀, 사미, 살카즈
        if(bundae == "지원 분대") maxHope += 2;
    }
    if(theme == 1){ //미즈키
        if(diff >= 4){
            for(let i = 2; i < 6; i++) hopeNeedNow[i]++;
        }
        if(bundae == "인적자원 분대"){
            for(let i = 2; i < 5; i++) {if(hopeNeedNow[i] > 0) hopeNeedNow[i]--}
        }
    }
    if(theme == 2 && diff >= 6){ //사미
        for(let i = 3; i < 6; i++) hopeNeedNow[i]++;
    }
    if(theme == 3){ //살카즈
        if(diff >= 13){
            for(let i = 4; i < 6; i++) hopeNeedNow[i]++;
            if(diff >= 15) hopeNeedNow[5]++;
        }
        if(bundae == "박학다식 분대") maxHope += 2;
        if(bundae == "도면 제작 분대") maxHope += 1;
        if(bundae == "의태학자 분대") maxHope += 1;
        // 기상천외는 랜덤으로 일부 들고오니까 고려하는 것을 포기합니다 하하!!!! 필요 희망 좀 줄 수도 있지
    }
    if(theme == 4 && diff >= 8){
        for(let i = 4; i < 6; i++) hopeNeedNow[i]++;
        if(diff >= 15) hopeNeedNow[5]++;
    }

    function chooseRarity(){
        let totalHope = 0;
        let totalMemCnt = 0;
        for(let i = 5; i >= 0; i--){
            hopeNow = hopeNeedNow[i];
            //===================================== 예외 처리
            if(i >= 3 && (theme == 1 || theme == 2 || theme == 3) && bundae == "강습 전술 분대" && stCart[totalMemCnt-1] <= 1 ) hopeNow -= 2;
            if(i >= 3 && (theme == 1 || theme == 2 || theme == 3) && bundae == "방어 전술 분대" && (stCart[totalMemCnt-1] == 2 || stCart[totalMemCnt-1] == 6 )) hopeNow -= 2;
            if(i >= 3 && (theme == 1 || theme == 2 || theme == 3) && bundae == "원거리 전술 분대" && (stCart[totalMemCnt-1] == 3 || stCart[totalMemCnt-1] == 5 )) hopeNow -= 2;
            if(i >= 3 && (theme == 1 || theme == 2 || theme == 3) && bundae == "파괴 전술 분대" && (stCart[totalMemCnt-1] == 4 || stCart[totalMemCnt-1] == 7 )) hopeNow -= 2;

            if(i >= 3 && (theme == 4) && bundae == "강습 전술 분대" && stCart[totalMemCnt+1] <= 1 ) hopeNow -= 1;
            if(i >= 3 && (theme == 4) && bundae == "방어 전술 분대" && (stCart[totalMemCnt+1] == 2 || stCart[totalMemCnt+1] == 6 )) hopeNow -= 1;
            if(i >= 3 && (theme == 4) && bundae == "원거리 전술 분대" && (stCart[totalMemCnt+1] == 3 || stCart[totalMemCnt+1] == 5 )) hopeNow -= 1;
            if(i >= 3 && (theme == 4) && bundae == "파괴 전술 분대" && (stCart[totalMemCnt+1] == 4 || stCart[totalMemCnt+1] == 7 )) hopeNow -= 1;
            if(i >= 3 && (theme == 4) && bundae == "고지대 돌파 분대" && stCart[totalMemCnt+1] >= 3 && stCart[totalMemCnt+1] <= 6) hopeNow -= 2;
            if(i >= 3 && (theme == 4) && bundae == "지상 돌파 분대" && (stCart[totalMemCnt+1] <= 2 || stCart[totalMemCnt+1] == 7 )) hopeNow -= 2;
            //=====================================
            if(hopeNow + totalHope > maxHope) continue;
            let rand = (i == 5) ? 1 : Math.random();
            if(rand > 0.15){
                rarity[totalMemCnt] = i;
                totalMemCnt++;
                totalHope += hopeNow;
                i++;
                if(totalMemCnt == 3) break;
            }
            if(i == 0 && totalMemCnt < 3) i = 5;
        }
    }

    var candList1 = [];
    var candList2 = [];
    var candList3 = [];

    while(candList1.length == 0 || candList2.length == 0 || candList3.length == 0 ){
        chooseRarity();
        rarity = shuffle(rarity);
        let randStCart = shuffle(stCart.slice(1,4));
        candList1 = memList[rarity[0]][randStCart[0]][0];
        candList2 = memList[rarity[1]][randStCart[1]][0];
        candList3 = memList[rarity[2]][randStCart[2]][0];
    }
    var cand1 = candList1[Math.floor(Math.random()*candList1.length)]
    var cand2 = cand1;
    var cand3 = cand1;
    while(cand2 == cand1) cand2 = candList2[Math.floor(Math.random()*candList2.length)];
    while(cand3 == cand1 || cand3 == cand2) cand3 = candList3[Math.floor(Math.random()*candList3.length)]
    var imageRef = ["img/1.png", "img/1.png", "img/1.png", "img/2.png", "img/3.png", "img/4.png"];
    for (let i = 0; i < 3; i++){
        cards[i+1].style.backgroundImage = `url('${imageRef[rarity[i]]}')`;
    }
    var candsList = [cand1, cand2, cand3];
    console.log(cand1);
    console.log(cand2);
    console.log(cand3);
</script>
